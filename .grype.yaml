# Grype vulnerability scanning configuration
# See: https://github.com/anchore/grype#specifying-matches-to-ignore
#
# 2026-09-01: pruned 6 moot ignores after pinning npm@11.19.1 EXACTLY in the
# Dockerfile — the npm CLI's bundled tree now ships tar 7.5.22, minimatch
# 10.2.5, brace-expansion 5.0.9, ip-address 10.5.0, none flagged by grype:
#   - GHSA-7r86-cg39-jmmj / GHSA-23c5-xmqv-rm74 (minimatch ReDoS)
#   - GHSA-rgw5-rvv9-x895 / GHSA-mh99-v99m-4gvg (brace-expansion)
#   - GHSA-mwp4-54f8-5fhr (ip-address)
#   - CVE-2026-27171 (zlib 1.3.1-r2 — no longer present on node:26.8.1-alpine
#     after apk upgrade)
# Verified by scanning the production image WITHOUT this config: the only
# remaining findings are the busybox trio covered below.

ignore:
  # busybox CVE-2025-60876 (Medium) - affects busybox, busybox-binsh, ssl_client
  # Alpine base image (node:26-alpine) package with no fix available in Alpine
  # repositories (first noted 2026-02-28; still unfixed as of 2026-09-01).
  - vulnerability: CVE-2025-60876
    reason: |
      Alpine base image (node:26-alpine) package with no fix available.
      Application runs as non-root user with limited busybox usage.
